<!-- @dsCard group="Components" viewport="700x340" name="Buttons" subtitle="Primary, secondary, outline, danger, icon — light + on-dark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--surface-page); padding: 22px; }
  .group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .dark { background: var(--brand-700); border-radius: var(--radius-md); padding: 18px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 8px; }
  .lbl.on { color: var(--brand-200); }
</style>
</head>
<body>
  <div class="lbl">Variants &amp; sizes</div>
  <div class="group" id="r1"></div>
  <div class="lbl">States &amp; icons</div>
  <div class="group" id="r2"></div>
  <div class="dark">
    <div class="lbl on">On dark slate</div>
    <div class="group" id="r3" style="margin-bottom:0"></div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="text/babel" src="../../ds-runtime.js"></script>
  <script type="text/babel">
    const { Button, IconButton } = window.AavasarDesignSystem_e30e7a;
    const Ico = ({ n }) => <i data-lucide={n} style={{ width: 18, height: 18 }}></i>;

    ReactDOM.createRoot(document.getElementById('r1')).render(<>
      <Button variant="primary">Sign Up</Button>
      <Button variant="secondary">Log In</Button>
      <Button variant="outline">View All</Button>
      <Button variant="danger">Reject</Button>
      <Button variant="primary" size="lg">Sign Up to Apply</Button>
      <Button variant="primary" size="sm">Apply</Button>
    </>);
    ReactDOM.createRoot(document.getElementById('r2')).render(<>
      <Button variant="primary" iconLeft={<Ico n="rocket" />}>Apply Now</Button>
      <Button variant="outline" iconLeft={<Ico n="settings" />}>Edit Profile</Button>
      <Button variant="primary" disabled>Disabled</Button>
      <IconButton ariaLabel="Notifications"><Ico n="bell" /></IconButton>
      <IconButton variant="bordered" ariaLabel="Help"><Ico n="help-circle" /></IconButton>
    </>);
    ReactDOM.createRoot(document.getElementById('r3')).render(<>
      <Button onDark variant="primary">Hire Talent</Button>
      <Button onDark variant="secondary">Learn More</Button>
      <Button onDark variant="outline">Explore</Button>
      <IconButton onDark ariaLabel="Share"><Ico n="share-2" /></IconButton>
    </>);
    setTimeout(() => lucide.createIcons(), 60);
  </script>
</body>
</html>
