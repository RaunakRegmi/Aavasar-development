<!-- @dsCard group="Components" viewport="700x230" name="Badges, Tags & Progress" subtitle="Status badges, skill chips, progress bars" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--surface-0); padding: 24px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-subtle); margin: 0 0 8px; }
  .group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .bars { display: grid; gap: 12px; max-width: 360px; }
  .barrow { display: flex; align-items: center; gap: 12px; }
  .barrow span { font-size: 13px; color: var(--text-muted); width: 64px; }
  .barrow > div { flex: 1; }
</style>
</head>
<body>
  <p class="lbl">Status badges</p>
  <div class="group" id="badges"></div>
  <p class="lbl">Skill &amp; meta tags</p>
  <div class="group" id="tags"></div>
  <p class="lbl">Progress</p>
  <div class="bars" id="bars"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../../ds-runtime.js"></script>
  <script type="text/babel">
    const { Badge, Tag, ProgressBar } = window.AavasarDesignSystem_e30e7a;
    ReactDOM.createRoot(document.getElementById('badges')).render(<>
      <Badge tone="active">In Progress</Badge>
      <Badge tone="submitted">Submitted</Badge>
      <Badge tone="reviewing">Reviewing</Badge>
      <Badge tone="draft">Draft</Badge>
      <Badge tone="rejected">Rejected</Badge>
      <Badge tone="premium">Premium</Badge>
    </>);
    ReactDOM.createRoot(document.getElementById('tags')).render(<>
      <Tag variant="brand">FIGMA</Tag>
      <Tag variant="brand">REACT</Tag>
      <Tag>Remote</Tag>
      <Tag>2 Weeks</Tag>
      <Tag variant="outline">On-site</Tag>
    </>);
    ReactDOM.createRoot(document.getElementById('bars')).render(<>
      <div className="barrow"><span>Profile</span><ProgressBar value={85} /></div>
      <div className="barrow"><span>Course</span><ProgressBar value={68} color="var(--accent-earth)" /></div>
      <div className="barrow"><span>Applicants</span><ProgressBar value={40} color="var(--brand-700)" /></div>
    </>);
  </script>
</body>
</html>
