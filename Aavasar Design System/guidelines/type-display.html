<!-- @dsCard group="Type" viewport="700x230" name="Display — Plus Jakarta Sans" subtitle="Headings, logo, big numbers — friendly-geometric, bold" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--surface-0); padding: 24px 28px; color: var(--text-strong); }
  .display { font-size: 52px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .h2 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-top: 10px; }
  .row { display: flex; align-items: baseline; gap: 16px; margin-top: 12px; }
  .num { font-size: 40px; font-weight: 800; color: var(--brand-700); }
  .lbl { font-size: 13px; font-weight: 600; color: var(--text-subtle); font-family: var(--font-text); }
</style>
</head>
<body>
  <div class="display">Find your next gig</div>
  <div class="h2">Welcome back, Pratikshya!</div>
  <div class="row">
    <div class="num">NPR 1,24,000</div>
    <div class="lbl">700 / 800 · −0.02em tracking · tabular numbers</div>
  </div>
</body>
</html>
