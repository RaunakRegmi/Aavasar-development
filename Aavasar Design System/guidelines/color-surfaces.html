<!-- @dsCard group="Colors" viewport="700x200" name="Surfaces" subtitle="Warm off-white pages, white cards, gray footer, dark slate panels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--surface-2); padding: 20px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-default); background: #fff; }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); }
  .hex { font-size: 11px; color: var(--text-subtle); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--surface-0)"></div><div class="meta"><div class="name">surface-0 · card</div><div class="hex">#FFFFFF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-page)"></div><div class="meta"><div class="name">page</div><div class="hex">#FBF9FA</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-1)"></div><div class="meta"><div class="name">surface-1</div><div class="hex">#F5F3F4</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="meta"><div class="name">surface-2</div><div class="hex">#EFEDEE</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-3)"></div><div class="meta"><div class="name">footer</div><div class="hex">#E3E2E3</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-dark)"></div><div class="meta"><div class="name">dark panel</div><div class="hex">#304554</div></div></div>
  </div>
</body>
</html>
