<!-- @dsCard group="Type" viewport="700x300" name="Type Scale" subtitle="Display 56 → micro 10, with role + family" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--surface-0); padding: 20px 28px; }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid var(--border-subtle); }
  .line:last-child { border-bottom: 0; }
  .spec { width: 130px; flex-shrink: 0; font-size: 11px; color: var(--text-subtle); }
  .spec b { color: var(--text-strong); font-weight: 600; display:block; font-size:12px; }
  .sample { color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d { font-family: var(--font-display); }
</style>
</head>
<body>
  <div class="line"><div class="spec"><b>Display</b>56 · Jakarta 700</div><div class="sample d" style="font-size:34px;font-weight:700;letter-spacing:-.02em">Opportunity</div></div>
  <div class="line"><div class="spec"><b>H1</b>40 · Jakarta 700</div><div class="sample d" style="font-size:28px;font-weight:700;letter-spacing:-.02em">Find your next gig</div></div>
  <div class="line"><div class="spec"><b>H3</b>24 · Jakarta 700</div><div class="sample d" style="font-size:22px;font-weight:700">Recommended for You</div></div>
  <div class="line"><div class="spec"><b>Body</b>16 · Inter 400</div><div class="sample" style="font-size:16px;color:var(--text-body)">Browse thousands of student-specific tasks.</div></div>
  <div class="line"><div class="spec"><b>Small</b>14 · Inter 400</div><div class="sample" style="font-size:14px;color:var(--text-muted)">Next Milestone: Unit Testing (Oct 29)</div></div>
  <div class="line"><div class="spec"><b>Eyebrow</b>12 · Inter 600 caps</div><div class="sample" style="font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-subtle)">Empowering Student Careers</div></div>
</body>
</html>
