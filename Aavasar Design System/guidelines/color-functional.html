<!-- @dsCard group="Colors" viewport="700x210" name="Functional / Semantic" subtitle="Used sparingly — green earnings, blue review, red error, earth learning" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--surface-0); padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .item { }
  .pair { display: flex; gap: 6px; margin-bottom: 8px; }
  .chip { height: 44px; flex: 1; border-radius: var(--radius-xs); border: 1px solid rgba(0,0,0,0.04); }
  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: var(--radius-full); font-size: 11px; font-weight: 600; }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); margin-bottom: 2px; }
  .hex { font-size: 11px; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="grid">
    <div class="item">
      <div class="pair"><div class="chip" style="background:var(--success-500)"></div><div class="chip" style="background:var(--success-100)"></div></div>
      <div class="name">Success</div><div class="hex">#10B981 · earnings, active</div>
      <div style="margin-top:6px"><span class="badge" style="background:var(--success-100);color:var(--success-700-text)">ACTIVE</span></div>
    </div>
    <div class="item">
      <div class="pair"><div class="chip" style="background:var(--info-500)"></div><div class="chip" style="background:var(--info-100)"></div></div>
      <div class="name">Info</div><div class="hex">#3B82F6 · reviewing</div>
      <div style="margin-top:6px"><span class="badge" style="background:var(--info-100);color:var(--info-700-text)">SUBMITTED</span></div>
    </div>
    <div class="item">
      <div class="pair"><div class="chip" style="background:var(--danger-500)"></div><div class="chip" style="background:var(--danger-100)"></div></div>
      <div class="name">Danger</div><div class="hex">#BA1A1A · error, reject</div>
      <div style="margin-top:6px"><span class="badge" style="background:var(--danger-100);color:var(--danger-700-text)">REJECTED</span></div>
    </div>
    <div class="item">
      <div class="pair"><div class="chip" style="background:var(--accent-earth)"></div><div class="chip" style="background:var(--star)"></div></div>
      <div class="name">Earth · Star</div><div class="hex">#553E23 · #F5B400</div>
      <div style="margin-top:6px"><span class="badge" style="background:var(--accent-earth);color:#fff">COURSE</span></div>
    </div>
  </div>
</body>
</html>
