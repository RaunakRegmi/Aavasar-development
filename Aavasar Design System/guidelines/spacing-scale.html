<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px base, 8px rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--surface-0); padding: 24px 28px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { text-align: center; }
  .bar { background: var(--brand-200); border: 1px solid var(--brand-300); border-radius: 2px; width: 100%; }
  .item .box { display:flex; align-items:flex-end; height: 64px; }
  .tok { font-size: 11px; font-weight: 600; color: var(--text-strong); margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="row">
    <div class="item" style="width:14px"><div class="box"><div class="bar" style="height:4px"></div></div><div class="tok">1</div><div class="val">4</div></div>
    <div class="item" style="width:18px"><div class="box"><div class="bar" style="height:8px"></div></div><div class="tok">2</div><div class="val">8</div></div>
    <div class="item" style="width:22px"><div class="box"><div class="bar" style="height:12px"></div></div><div class="tok">3</div><div class="val">12</div></div>
    <div class="item" style="width:26px"><div class="box"><div class="bar" style="height:16px"></div></div><div class="tok">4</div><div class="val">16</div></div>
    <div class="item" style="width:34px"><div class="box"><div class="bar" style="height:24px"></div></div><div class="tok">6</div><div class="val">24</div></div>
    <div class="item" style="width:42px"><div class="box"><div class="bar" style="height:32px"></div></div><div class="tok">8</div><div class="val">32</div></div>
    <div class="item" style="width:58px"><div class="box"><div class="bar" style="height:48px"></div></div><div class="tok">12</div><div class="val">48</div></div>
    <div class="item" style="width:74px"><div class="box"><div class="bar" style="height:64px"></div></div><div class="tok">16</div><div class="val">64</div></div>
  </div>
</body>
</html>
