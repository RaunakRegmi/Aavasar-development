<!-- @dsCard group="Colors" viewport="700x190" name="Brand — Slate Blue" subtitle="The single brand color that does most of the work" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--surface-0); padding: 20px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); font-family: var(--font-text); }
  .hex { font-size: 11px; color: var(--text-subtle); font-family: var(--font-text); margin-top: 2px; }
  .star { color: #fff; font-size: 11px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--brand-900)"></div><div class="meta"><div class="name">900</div><div class="hex">#1F2E3A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-800)"></div><div class="meta"><div class="name">800</div><div class="hex">#263948</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-700)"></div><div class="meta"><div class="name">700 · Primary</div><div class="hex">#304554</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-500)"></div><div class="meta"><div class="name">500</div><div class="hex">#475C6C</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-300)"></div><div class="meta"><div class="name">300</div><div class="hex">#8499A8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-200)"></div><div class="meta"><div class="name">200 · Tint</div><div class="hex">#BED4E7</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--brand-50)"></div><div class="meta"><div class="name">50</div><div class="hex">#EEF3F7</div></div></div>
  </div>
</body>
</html>
