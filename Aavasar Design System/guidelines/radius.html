<!-- @dsCard group="Spacing" viewport="700x170" name="Radius" subtitle="Snappy controls (4px) → rounder containers (24px)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--surface-0); padding: 24px 28px; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 72px; height: 72px; background: var(--brand-50); border: 1.5px solid var(--brand-300); }
  .tok { font-size: 12px; font-weight: 600; color: var(--text-strong); margin-top: 8px; }
  .val { font-size: 11px; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="tok">xs · button</div><div class="val">4px</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="tok">sm · input</div><div class="val">8px</div></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><div class="tok">md · stat card</div><div class="val">12px</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="tok">lg · panel</div><div class="val">16px</div></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><div class="tok">xl · feature</div><div class="val">24px</div></div>
    <div class="item"><div class="box" style="border-radius:9999px"></div><div class="tok">full · pill</div><div class="val">9999</div></div>
  </div>
</body>
</html>
