<!-- @dsCard group="Type" viewport="700x230" name="Text — Inter" subtitle="Body, labels, UI — regular 16/24, weights 400–700" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--surface-0); padding: 24px 28px; }
  .lead { font-size: 16px; line-height: 1.6; color: var(--text-body); max-width: 560px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 8px; }
  .weights { display: flex; gap: 20px; margin-top: 16px; align-items: baseline; }
  .weights span { font-size: 18px; color: var(--text-strong); }
  .cap { font-size: 11px; color: var(--text-subtle); display:block; margin-top:2px; }
</style>
</head>
<body>
  <div class="eyebrow">Empowering Student Careers</div>
  <div class="lead">Join a community of 10,000+ students getting paid for their professional skills while they study. No long-term commitments, just great opportunities.</div>
  <div class="weights">
    <div><span style="font-weight:400">Regular</span><span class="cap">400</span></div>
    <div><span style="font-weight:500">Medium</span><span class="cap">500</span></div>
    <div><span style="font-weight:600">Semibold</span><span class="cap">600</span></div>
    <div><span style="font-weight:700">Bold</span><span class="cap">700</span></div>
    <div><span style="font-weight:400;font-style:italic">Italic</span><span class="cap">400i</span></div>
  </div>
</body>
</html>
