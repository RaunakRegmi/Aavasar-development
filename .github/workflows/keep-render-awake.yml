name: Keep Render Backend Awake

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Backend
        run: |
          curl -fsS https://aavasar-development-1.onrender.com/healthz